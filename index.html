
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMESTER 4 IPS 4</title>

<style>
body{
font-family: 'Poppins', sans-serif;
background: linear-gradient(135deg,#1f4037,#99f2c8);
margin:0;
padding:20px;
color:white;
}

.container{
max-width:520px;
margin:auto;
background:white;
color:#333;
padding:20px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h1{
text-align:center;
color:#1f4037;
}

.quote{
text-align:center;
font-size:14px;
margin-bottom:10px;
color:#666;
}

.date{
text-align:center;
font-weight:bold;
margin-bottom:15px;
}

.section{
margin-top:20px;
}

.task{
display:flex;
align-items:center;
margin:8px 0;
background:#f2f2f2;
padding:10px;
border-radius:10px;
}

.progress{
margin-top:15px;
background:#ddd;
border-radius:20px;
overflow:hidden;
}

.progress-bar{
height:20px;
width:0%;
background:linear-gradient(90deg,#1f4037,#99f2c8);
text-align:center;
color:white;
font-size:12px;
}

button{
margin-top:10px;
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#1f4037;
color:white;
font-weight:bold;
}

.streak{
text-align:center;
margin-top:15px;
font-weight:bold;
color:#1f4037;
}

input[type="number"]{
width:100%;
padding:8px;
border-radius:8px;
border:1px solid #ccc;
margin-top:5px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎯 SEMESTER 4 IPS 4</h1>
<div class="quote">Konsisten kecil → IPS maksimal 💖</div>
<div class="date" id="date"></div>

<div class="section">
<h3>📚 Checklist Harian</h3>

<div class="task"><input type="checkbox" onclick="update()"> Review materi</div>
<div class="task"><input type="checkbox" onclick="update()"> Rangkuman</div>
<div class="task"><input type="checkbox" onclick="update()"> Cicil tugas</div>
<div class="task"><input type="checkbox" onclick="update()"> Latihan soal</div>
<div class="task"><input type="checkbox" onclick="update()"> Aktif di kelas</div>
<div class="task"><input type="checkbox" onclick="update()"> Belajar fokus 30 menit</div>

<div class="progress">
<div class="progress-bar" id="bar">0%</div>
</div>

<button onclick="resetChecklist()">Reset Hari Ini</button>
</div>

<div class="section">
<h3>🏆 Target IPS</h3>
<input type="number" placeholder="Masukkan target IPS kamu..." id="ipsInput">
<button onclick="setTarget()">Simpan Target</button>
<p id="ipsDisplay"></p>
</div>

<div class="section">
<h3>🔥 Streak Konsistensi</h3>
<button onclick="addStreak()">Hari Produktif +1</button>
<div class="streak" id="streak">Streak: 0 hari</div>
</div>

</div>

<script>
let streak=0;

function update(){
let checkboxes=document.querySelectorAll("input[type='checkbox']");
let checked=0;
checkboxes.forEach(c=>{ if(c.checked) checked++; });

let percent=(checked/checkboxes.length)*100;
let bar=document.getElementById("bar");
bar.style.width=percent+"%";
bar.innerHTML=Math.round(percent)+"%";
}

function resetChecklist(){
document.querySelectorAll("input[type='checkbox']").forEach(c=>c.checked=false);
update();
}

function addStreak(){
streak++;
document.getElementById("streak").innerText="Streak: "+streak+" hari 🔥";
}

function setTarget(){
let val=document.getElementById("ipsInput").value;
document.getElementById("ipsDisplay").innerText="Target IPS kamu: "+val+" 💖";
}

let today=new Date();
document.getElementById("date").innerHTML=
today.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
</script>

</body>
</html>
